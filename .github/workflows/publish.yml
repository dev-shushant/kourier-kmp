name: Publish Kourier SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK Version to publish (e.g. 0.0.9)'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run (test build & packaging without publishing to remote)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish Android & iOS SDK
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DIST_REPO_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Validate Distribution Credentials
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ -z "${{ secrets.DIST_REPO_TOKEN || secrets.GH_PAT }}" ]; then
            echo "::error title=Missing Distribution Token::Pushing to external distribution repo 'dev-shushant/kourier' requires a Personal Access Token (PAT) because the default GITHUB_TOKEN is scoped only to 'dev-shushant/kourier-kmp'. Please add a secret named 'DIST_REPO_TOKEN' (or 'GH_PAT') with 'repo' scope in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Grant Execute Permission to Scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/publish_optimized.sh

      - name: Execute Publishing Pipeline
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC"
          DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN || secrets.GH_PAT || '' }}
          GITHUB_TOKEN: ${{ secrets.DIST_REPO_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Clear actions/checkout local extraheader so custom credentials can communicate with the dist repo
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          FLAGS=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            FLAGS="${FLAGS} --version ${{ github.event.inputs.version }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="${FLAGS} --dry-run"
          fi
  
          ./scripts/publish_optimized.sh ${FLAGS}

      - name: Upload KourierIos XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KourierIos-xcframework
          path: kourier-ios/build/XCFrameworks/release/KourierIos.xcframework.zip

      - name: Commit & Push Updated Package.swift
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift version.properties
          if ! git diff-index --quiet HEAD; then
            TARGET_BRANCH="${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch || 'master' }}"
            git commit -m "chore(release): bump SDK to $(cat version.properties | grep VERSION_NAME | cut -d'=' -f2) [skip ci]"
            git push origin HEAD:${TARGET_BRANCH}
          fi